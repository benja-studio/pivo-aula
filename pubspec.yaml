name: pivo_aula
description: "Aula - Academic life organizer for university students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Local Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Simple Preferences & Secure Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Biometric Auth
  local_auth: ^2.2.0

  # Profile Picture
  image_picker: ^1.1.2

  # Notifications & Timezones
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Backup, Archive & Cryptography
  archive: ^3.6.1
  file_picker: ^8.1.2
  share_plus: ^10.0.2
  cryptography: ^2.7.0
  crypto: ^3.0.5

  # UI, Animation & Charts
  flutter_animate: ^4.5.0
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
