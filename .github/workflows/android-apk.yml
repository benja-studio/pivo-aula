name: Android APK validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart sources
        id: analyze
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Run Flutter tests
        id: tests
        run: flutter test --no-pub
        continue-on-error: true

      - name: Build release APK
        id: build_apk
        run: flutter build apk --release --no-pub

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivo-aula-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation results
        if: always()
        shell: bash
        run: |
          failed=0
          if [[ "${{ steps.analyze.outcome }}" != "success" ]]; then
            echo "::error::Dart analysis failed."
            failed=1
          fi
          if [[ "${{ steps.tests.outcome }}" != "success" ]]; then
            echo "::error::Flutter tests failed."
            failed=1
          fi
          if [[ "${{ steps.build_apk.outcome }}" != "success" ]]; then
            echo "::error::Release APK build failed."
            failed=1
          fi
          exit "$failed"
